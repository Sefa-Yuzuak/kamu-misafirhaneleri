server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS kenar katmanda sonlanıyor; nginx isteği http olarak görüyor ve
    # mutlak Location kurunca şemayı http'ye düşürüyordu:
    #   https://…/il/ankara -> 301 -> http://…/il/ankara/ -> 302 -> https
    # Üç istekten biri şifresiz gidiyordu. Göreli Location şemayı korur.
    absolute_redirect off;
    port_in_redirect off;

    # www ve apex aynı içeriği 200 ile veriyordu: 1007 URL iki ayrı ana
    # bilgisayarda birden erişilebilir, yani Google için yinelenen içerik.
    if ($host ~* ^www\.(?<apex>.+)$) {
        return 301 https://$apex$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript image/svg+xml application/manifest+json;

    # DİKKAT: nginx'te add_header alt bloklara DEVRALINMAZ. Bir location kendi
    # add_header'ını tanımladığı anda buradaki başlıklar o bağlamda düşer — bu
    # yüzden güvenlik başlıkları 1007 HTML sayfanın hiçbirine gitmiyordu.
    # Her location kendi kopyasını taşımak zorunda.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # HTML: her zaman tazele, ama yeniden doğrulama ucuz olsun
    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Açık veri
    location ~* ^/(tesisler\.json|data/.*\.json|llms\.txt)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # Adında içerik damgası taşıyanlar (s.<hash>.css) ve görseller: içerik
    # değişince dosya adı da değişir, bir yıl dokunulmadan saklanabilir.
    # Not: regex'te süslü parantez kullanılmıyor — nginx, {} içeren düzenli
    # ifadelerin tırnaklanmasını ister; [0-9a-f]+ hem yeterli hem tuzaksız.
    location ~* (\.[0-9a-f]+\.(?:css|js)|\.(?:svg|ico|png|jpg|jpeg|webp|avif))$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Adı sabit kalan dosyalar (a.js, t.js, h.js ve yazı tipleri): içerikleri
    # değişebiliyor. Bir yıl "immutable" verilince bir JS düzeltmesi geri
    # dönen ziyaretçiye bir yıl ulaşmıyordu; yenilenen yazı tipi alt kümesi de
    # eski hâliyle takılı kalırdı. Bir hafta + yeniden doğrulama.
    location ~* \.(?:js|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # index.html'i olmayan varlık dizinleri (/img/, /static/, /data/) çıplak
    # nginx "Forbidden" ekranı gösteriyordu; sitenin kendi 404'ü daha iyi.
    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store";
    }
}
